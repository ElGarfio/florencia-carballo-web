gallery_quote:
  en: '"Everyone discusses my art and pretends to understand, as if it were necessary to understand, when it is simply necessary to love."'
  it: '"Tutti discutono della mia arte e fingono di capirla, come se fosse necessario capirla, quando è semplicemente necessario amarla."'
  es: '"Todo el mundo habla de mi arte y pretende entenderlo, como si fuera necesario entenderlo, cuando simplemente es necesario amarlo."'
gallery_quote_author:
  en: — Claude Monet
  it: — Claude Monet
  es: — Claude Monet
