gallery_p:
  en: Exploring the fleeting beauty of light and the vibrant textures of the natural world through the curated works of Florencia Carballo.
  it: Esplorare la bellezza fugace della luce e le vivaci trame del mondo naturale attraverso le opere di Florencia Carballo.
  es: Explorando la belleza fugaz de la luz y las vibrantes texturas del mundo natural a través de las obras de Florencia Carballo.
