studio_badge:
  en: The Creative Advisor
  it: La Consulente Creativa
  es: La Asesora Creativa
studio_h1:
  en: Curated <span class="text-primary">Atmospheres</span>
  it: Atmosfere <span class="text-primary">Curate</span>
  es: Atmósferas <span class="text-primary">Curadas</span>
studio_hero_p:
  en: Florencia Carballo merges her expertise in impressionism with a deep understanding of architectural space, creating bespoke art for gastronomic environments, commercial spaces and private residences.
  it: Florencia Carballo unisce la sua esperienza nell'impressionismo a una profonda comprensione dello spazio architettonico, creando arte su misura per ambienti gastronomici, spazi commerciali e residenze private.
  es: Florencia Carballo fusiona su experiencia en el impresionismo con una profunda comprensión del espacio arquitectónico, creando arte a medida para entornos gastronómicos, espacios comerciales y residencias privadas.
studio_hero_btn:
  en: Art Advisory Services
  it: Servizi di Consulenza Artistica
  es: Servicios de Asesoramiento Artístico
studio_hero_quote:
  en: '"Art should not just hang on a wall; it should converse with the room it inhabits."'
  it: '"L''arte non dovrebbe semplicemente stare su un muro; dovrebbe conversare con la stanza che abita."'
  es: '"El arte no debería simplemente colgar de una pared; debería conversar con la habitación que habita."'
studio_vision_title:
  en: Vision & Guidance
  it: Visione & Guida
  es: Visión & Guía
studio_vision_p1:
  en: With a profound mastery of light and colour rooted in impressionist traditions, Florencia Carballo approaches each project as a unique narrative. She doesn't just create paintings — she crafts visual identities for the spaces they live in.
  it: Con una profonda padronanza della luce e del colore radicata nelle tradizioni impressioniste, Florencia Carballo affronta ogni progetto come una narrativa unica. Non crea solo dipinti — costruisce identità visive per gli spazi in cui vivono.
  es: Con un profundo dominio de la luz y el color arraigado en las tradiciones impresionistas, Florencia Carballo aborda cada proyecto como una narrativa única. No solo crea pinturas — construye identidades visuales para los espacios en que viven.
studio_vision_p2:
  en: As a dedicated art advisor, Florencia works closely with interior designers and business owners to ensure every piece resonates with its surroundings. From the high-energy atmosphere of a restaurant to the intimate sanctuary of a private home, her guidance helps clients choose work that elevates their specific environment.
  it: Come consulente artistica dedicata, Florencia collabora strettamente con interior designer e imprenditori per garantire che ogni opera risuoni con il suo ambiente. Dai ristoranti alle residenze private, la sua guida aiuta i clienti a scegliere opere che valorizzano il loro spazio specifico.
  es: Como asesora artística dedicada, Florencia trabaja estrechamente con diseñadores de interiores y empresarios para garantizar que cada pieza resuene con su entorno. Desde la energía de un restaurante hasta la intimidad de un hogar privado, su guía ayuda a los clientes a elegir obras que elevan su espacio.
